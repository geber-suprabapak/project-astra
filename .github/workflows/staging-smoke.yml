name: Staging Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Verify staging runtime contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate staging access token
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          TOKEN=$(bun run auth:token --json | jq -r '.access_token')
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run staging smoke verification
        env:
          ACCESS_TOKEN: ${{ env.ACCESS_TOKEN }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_LATITUDE: ${{ secrets.SMOKE_LATITUDE }}
          SMOKE_LONGITUDE: ${{ secrets.SMOKE_LONGITUDE }}
        run: bun run smoke:staging

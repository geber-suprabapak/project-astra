name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/geber-suprabapak/project-astra

jobs:
  verify:
    name: Verify source SHA before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Dependency audit (high and above)
        run: bun audit --audit-level=high

      - name: Record verified source SHA
        run: |
          {
            echo "## Docker Image verify"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | \`${{ github.sha }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| Workflow run | \`${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

  docker:
    name: Build Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      verified_sha: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release pointer
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_REF="${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          {
            echo "## Published image release pointer"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source SHA | \`${{ github.sha }}\` |"
            echo "| Pushed digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Immutable image ref | \`$IMAGE_REF\` |"
            echo "| Provenance / SBOM | attached to the pushed image (buildx attestation, mode=max / true) |"
            echo ""
            echo "Deployment gate: before any runtime promotion, compare the effective desired image reference with the approved release record for this digest. Runtime promotion requires a separate production preflight and approval."
          } >> "$GITHUB_STEP_SUMMARY"

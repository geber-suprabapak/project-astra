apiVersion: v1
kind: Secret
metadata:
  name: project-astra-secrets
  labels:
    app.kubernetes.io/name: project-astra
type: Opaque
stringData:
  SUPABASE_ANON_KEY: replace-me
  SUPABASE_SERVICE_ROLE_KEY: replace-me
  SUPABASE_JWT_SECRET: replace-me-if-using-shared-secret
  SUPABASE_JWKS_URL: https://your-project.supabase.co/.well-known/jwks.json
  SUPABASE_JWT_ISSUER: https://your-project.supabase.co/auth/v1
  REDIS_URL: redis://default:password@redis.example.internal:6379
